# Nginx Workflow Ssl Feature Or Refactor

## Action

Follow the ssl-feature-or-refactor workflow:
1. Edit or add implementation in src/event/ngx_event_openssl.c
2. Edit or add headers in src/event/ngx_event_openssl.h
3. Edit or add implementation in src/event/ngx_event_openssl_cache.c (if related to caching)
4. Edit SSL-related modules in src/http/modules/ngx_http_ssl_module.c, src/mail/ngx_mail_ssl_module.c, or src/stream/ngx_stream_ssl_module.c as needed

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/event/ngx_event_openssl.c, src/event/ngx_event_openssl.h, src/event/ngx_event_openssl_cache.c

